[project]
name = "research-agent-citations"
version = "0.1.0"
description = "Advanced Research Agent with Citations and Guardrails built with LangGraph, Groq, and Google Embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.20",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "tavily-python>=0.7.27",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
